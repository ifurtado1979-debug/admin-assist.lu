<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISAssistance Administrative - Contact</title>
<link rel="stylesheet" href="style.css">
</head>
  
<body class="contact">

<header>
<div class="container">
  
<h1>ISAssistance Administrative</h1>
<nav>
<a href="index.html" class="btn">Accueil</a>
<a href="services.html" class="btn">Services</a>
<a href="contact.html" class="btn">Contact</a>
</nav>
</div>
</header>

<main>
<section class="contact-form">
<h2>Contact</h2>

<p><strong>ISAssistance Administrative</strong></p>
<p>📍 Luxembourg</p>
<p>📧 Email : <a href="mailto:contact@admin-assist.lu">contact@admin-assist.lu</a></p>
<p>📞 Téléphone : <a href="tel:+352621374708">+352 621 374 708</a></p>
<form id="contact-form" action="https://formspree.io/f/meednjen" method="POST">

<input type="text" name="name" placeholder="Votre nom" required><br>

<input type="email" name="email" placeholder="Votre email" required><br>

<textarea name="message" placeholder="Votre message" required></textarea><br>

<input type="hidden" name="_subject" value="Nouveau message ISA Assistance">

<button type="submit">Envoyer</button>

</form>
<p id="success-message" style="display:none; color:green; margin-top:15px;">
✅ Merci pour votre message. Nous vous répondrons rapidement.
</p>

<script>
const form = document.getElementById('contact-form');
const successMessage = document.getElementById('success-message');

form.addEventListener('submit', async function(e) {
  e.preventDefault();

  const data = new FormData(form);

  const response = await fetch(form.action, {
    method: form.method,
    body: data,
    headers: {
      'Accept': 'application/json'
    }
  });

  if (response.ok) {
    successMessage.style.display = 'block';
    form.reset();
  } else {
    alert("Une erreur est survenue. Veuillez réessayer.");
  }
});
</script>
</section>
</main>

<footer>
<p>© 2026 ISAssistance Administrative | Luxembourg</p>
</footer>

</body>
</html>
